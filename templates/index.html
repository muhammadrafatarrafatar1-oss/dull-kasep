<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Z×ice lanz dulll - Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #050505; --primary: #FFD700; --cyan: #00F0FF; --text-main: #FFFFFF; --text-sub: #A0A0A0;
    --glass-bg: rgba(20, 20, 20, 0.4); --glass-border: rgba(255, 255, 255, 0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background-color: var(--bg-color); background-image: radial-gradient(circle at center, #111 0%, #000 100%); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  
  /* LAYAR GAME / FILM */
  .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 9998; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; opacity: 0.3; }
  .cinema-bar { position: fixed; left: 0; right: 0; height: 6vh; background: #000; z-index: 9997; pointer-events: none; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
  .cinema-top { top: 0; border-bottom: 1px solid #222; } .cinema-bottom { bottom: 0; border-top: 1px solid #222; }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 9996; box-shadow: inset 0 0 200px rgba(0,0,0,1); }

  /* SPLASH SCREEN (OTOMATIS HILANG) */
  #splash-screen { position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease, visibility 1s; }
  #splash-screen.hidden { opacity: 0; visibility: hidden; }
  .glitch-text { font-family: 'Cinzel', serif; font-size: 50px; font-weight: 900; color: #fff; position: relative; letter-spacing: 5px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); margin-bottom: 20px; animation: glitch 3s infinite; }
  @keyframes glitch { 0% { transform: translate(0) } 2% { transform: translate(2px, 0) } 4% { transform: translate(-2px, 0) } 6% { transform: translate(0) } 100% { transform: translate(0) } }
  .sys-text { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--cyan); margin-bottom: 40px; letter-spacing: 2px; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* MAIN CONTENT */
  .main-content { opacity: 0; transition: opacity 1s ease; display: flex; flex-direction: column; height: 100vh; }
  .main-content.show { opacity: 1; }
  #bg-media { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; z-index: 10; margin-top: 6vh; }
  .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.3); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: #00FF66; font-weight: 600; backdrop-filter: blur(5px); }
  .status-dot { width: 8px; height: 8px; background: #00FF66; border-radius: 50%; box-shadow: 0 0 10px #00FF66; animation: pulse 2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  .top-right { display: flex; gap: 15px; }
  .btn-glass { background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; backdrop-filter: blur(10px); transition: 0.3s; }
  .btn-glass:hover { background: rgba(255, 255, 255, 0.1); border-color: #fff; }
  .btn-primary { background: var(--primary); border: none; color: #000; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }

  .hero { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 50px; z-index: 10; position: relative; }
  .hero-content { text-align: center; max-width: 800px; }
  .hero-sub { color: var(--primary); font-weight: 600; font-size: 18px; margin-bottom: 15px; letter-spacing: 4px; text-transform: uppercase; }
  .hero-title { font-family: 'Cinzel', serif; font-size: 72px; font-weight: 900; line-height: 1.1; margin-bottom: 30px; text-shadow: 0 0 30px rgba(255, 255, 255, 0.4); background: linear-gradient(to right, #fff, #999); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  
  /* INFO GRID BARU */
  .contact-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
  .contact-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-sub); background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
  .contact-item span { color: #fff; font-weight: 600; font-family: 'Share Tech Mono', monospace; }

  .bottom-nav-container { position: absolute; bottom: 8vh; width: 100%; display: flex; justify-content: center; z-index: 10; }
  .bottom-nav { display: flex; align-items: center; gap: 5px; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 8px 15px; border-radius: 30px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 20px; color: var(--text-sub); font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; border: none; background: transparent; }
  .nav-item.active { background: rgba(255, 255, 255, 0.15); color: #fff; }

  /* MODALS */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 10000; }
  .modal-overlay.active { display: flex; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; color: #fff; border-top: 2px solid var(--primary); }
  .modal-title { font-family: 'Cinzel', serif; font-size: 24px; font-weight: 800; margin-bottom: 20px; text-align: center; }
  .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-sub); }
  .input-glass { width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff; outline: none; }
  .output-box { background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-top: 10px; display: none; word-break: break-all; }
  .output-box.active { display: block; }

  /* MUSIC */
  .music-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; }
  .music-btn { width: 60px; height: 60px; border-radius: 50%; background: var(--primary); border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .music-btn svg { width: 24px; height: 24px; fill: #000; }
  .song-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; }
  .song-item { padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; }
  .song-item.active { background: rgba(255,215,0,0.1); color: var(--primary); }
  #yt-player { display: none; }
</style>
</head>
<body>

<!-- SPLASH SCREEN (AUTO HILANG) -->
<div id="splash-screen">
  <div class="glitch-text">Z×ICE LANZ DULLL</div>
  <div class="sys-text">> TOUCH SCREEN TO INITIALIZE FULLSCREEN_</div>
</div>

<div class="scanlines"></div>
<div class="cinema-bar cinema-top"></div>
<div class="cinema-bar cinema-bottom"></div>
<div class="vignette"></div>

<!-- MAIN CONTENT -->
<div class="main-content" id="mainContent">
  
  <video id="bg-media" loop>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
  </video>

  <div id="yt-player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>

  <div class="top-bar">
    <div class="status-badge"><div class="status-dot"></div> Available for work</div>
    <div class="top-right">
      <button class="btn-glass" onclick="openModal('loginModal')">Login</button>
      <button class="btn-glass" onclick="openModal('toolsModal')">Tools</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-content">
      <div class="hero-sub">Cyber Security & Developer</div>
      <div class="hero-title">Z×ice lanz dulll</div>
      
      <!-- INFO BARU: EMAIL, JAM, IP, DEVICE -->
      <div class="contact-grid">
        <div class="contact-item">📧 <span>dull.genggong@darkweb.com</span></div>
        <div class="contact-item">⏰ <span id="liveClock">--:--:--</span></div>
        <div class="contact-item">🌐 <span id="ipAddress">Loading IP...</span></div>
        <div class="contact-item">📱 <span id="deviceName">Detecting...</span></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav-container">
    <div class="bottom-nav">
      <button class="nav-item active" onclick="navSelect(this)">🏠 Home</button>
      <button class="nav-item" onclick="navSelect(this)">👤 About</button>
      <button class="nav-item" onclick="openModal('toolsModal')">📁 Projects</button>
      <button class="nav-item" onclick="openModal('musicModal')">🎵 Music</button>
      <button class="nav-item" onclick="navSelect(this)">⚠️ Contact</button>
    </div>
  </div>

</div>

<!-- MODALS -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <div class="modal-title">Access Portal</div>
    <div class="input-group"><label>Username</label><input type="text" id="loginUser" class="input-glass" placeholder="Enter username..."></div>
    <div class="input-group"><label>Password</label><input type="password" id="loginPass" class="input-glass" placeholder="Enter password..."></div>
    <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div class="modal-overlay" id="toolsModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('toolsModal')">✕</button>
    <div class="modal-title">Developer Tools</div>
    <div class="input-group">
      <label>Public API Key Generator</label>
      <button class="btn-glass" style="width: 100%;" onclick="genApiKey()">Generate API Key</button>
      <div class="output-box" id="apiResult"></div>
    </div>
    <div class="input-group" style="margin-top: 20px;">
      <label>SFL to MediaFire Bypass</label>
      <input type="text" id="sflInput" class="input-glass" placeholder="https://sfl.gl/xxxxx">
      <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="bypassSfl()">Bypass Link</button>
      <div class="output-box" id="sflResult"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="musicModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('musicModal')">✕</button>
    <div class="modal-title">Music Player</div>
    <div class="music-controls">
      <button class="music-btn" id="playPauseBtn" onclick="togglePlay()">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
    <div class="song-list" id="songList"></div>
  </div>
</div>

<script>
  const SERVER_URL = ""; 

  // === FITUR FULLSCREEN & AUTO AUDIO (TRICK TANPA TOMBOL) ===
  // Splash layar akan hilang otomatis dalam 2 detik
  setTimeout(() => {
    document.getElementById('splash-screen').classList.add('hidden');
    document.getElementById('mainContent').classList.add('show');
  }, 2000);

  // Pas user nyentuh layar pertama kali (klik/scroll), langsung Fullscreen & Play Audio
  let isInitialized = false;
  document.body.addEventListener('click', () => {
    if(isInitialized) return;
    isInitialized = true;

    // 1. Masuk Fullscreen
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(e => console.log("Fullscreen diblokir browser"));
    }

    // 2. Play Audio MP4
    const media = document.getElementById('bg-media');
    if(media) media.play().catch(e => console.log("Audio butuh interaksi"));

    // 3. Play Lagu Pertama (Opsional)
    if (player && player.playVideo) {
        player.playVideo();
    }
  });

  // === INFO REAL-TIME: JAM, IP, DEVICE ===
  function updateInfo() {
    // 1. Jam Real-time
    setInterval(() => {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
    }, 1000);

    // 2. Deteksi Device
    const ua = navigator.userAgent;
    let device = "Unknown Device";
    if(ua.includes("Android")) device = "Android Device";
    else if(ua.includes("iPhone") || ua.includes("iPad")) device = "iOS Device";
    else if(ua.includes("Windows")) device = "Windows PC";
    else if(ua.includes("Mac")) device = "MacBook / iMac";
    document.getElementById('deviceName').innerText = device;

    // 3. Ambil IP Address
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => document.getElementById('ipAddress').innerText = data.ip)
      .catch(() => document.getElementById('ipAddress').innerText = "IP Hidden / Error");
  }
  updateInfo(); // Panggil pas web dimuat

  // === MODAL & UI ===
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function navSelect(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }

  function doLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    if(u === 'dulll genggong' && p === 'dulll brengsek') { alert('Login Berhasil!'); closeModal('loginModal'); } 
    else { alert('Username/Password Salah!'); }
  }

  // === TOOLS ===
  async function genApiKey() {
    const out = document.getElementById('apiResult');
    out.innerHTML = `<span style="color:#FFD700">Membuat key di database...</span>`;
    out.classList.add('active');
    try {
        const res = await fetch(`${SERVER_URL}/api/generate_key`, { method: 'POST' });
        const data = await res.json();
        if (data.status === 'success') {
            out.innerHTML = `
                <div style="color:#00FF66; font-weight:bold; margin-bottom:5px;">✅ API KEY PUBLIK DIBUAT!</div>
                <span style="color:#FFD700; font-weight:bold; font-size:14px;">${data.api_key}</span>
            `;
        } else { throw new Error(data.message); }
    } catch (error) { out.innerHTML = `<span style="color:#FF007F">Gagal: ${error.message}</span>`; }
  }

  async function bypassSfl() {
    const url = document.getElementById('sflInput').value.trim();
    const out = document.getElementById('sflResult');
    if(!url) return alert('Masukkan link SFL!');
    out.innerHTML = `<span style="color:#FFD700">Menerobos Cloudflare...</span>`;
    out.classList.add('active');
    try {
        const res = await fetch(`${SERVER_URL}/api/sfl_bypass`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url })
        });
        const data = await res.json();
        if (data.status === 'success') {
            out.innerHTML = `<div style="color:#00FF66; font-weight:bold; margin-bottom:5px;">✅ CLOUDFLARE DITEMBUS!</div><a href="${data.link}" target="_blank" style="color:#00F0FF; text-decoration:underline;">${data.link}</a>`;
        } else { throw new Error(data.message); }
    } catch (error) { out.innerHTML = `<span style="color:#FF007F">Gagal: ${error.message}</span>`; }
  }

  // === MUSIC ===
  const songs = [
    { title: "Song 1 (Lofi Chill)", id: "jfKfPfyJRdk" },
    { title: "Song 2 (Phonk Drift)", id: "4xDzrJKXOOY" },
    { title: "Song 3 (Sad Instrumental)", id: "lTRiuFIWV54" },
    { title: "Song 4 (Epic Cyberpunk)", id: "h3gEkZhFoMg" },
    { title: "Song 5 (Night Ambient)", id: "1ZYbU82GVz4" }
  ];
  let player, isPlaying = false, currentSongIndex = 0;
  
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('yt-player', { height: '0', width: '0', videoId: songs[0].id, playerVars: { 'autoplay': 0, 'controls': 0 }, events: { 'onStateChange': onPlayerStateChange } });
    renderSongList();
  }
  function renderSongList() {
    document.getElementById('songList').innerHTML = songs.map((s, i) => `
      <div class="song-item ${i === currentSongIndex ? 'active' : ''}" onclick="playSong(${i})">
        <span>${s.title}</span><span>${i === currentSongIndex && isPlaying ? '🔊' : '🎵'}</span>
      </div>
    `).join('');
  }
  function playSong(index) { currentSongIndex = index; player.loadVideoById(songs[index].id); isPlaying = true; updateUI(); }
  function togglePlay() { if (!player) return; if (isPlaying) player.pauseVideo(); else player.playVideo(); }
  function onPlayerStateChange(event) { isPlaying = (event.data === YT.PlayerState.PLAYING); updateUI(); }
  function updateUI() {
    document.getElementById('icon-play').style.display = isPlaying ? 'none' : 'block';
    document.getElementById('icon-pause').style.display = isPlaying ? 'block' : 'none';
    renderSongList();
  }
</script>
</body>
</html>
